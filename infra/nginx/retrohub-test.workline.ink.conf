# Install on the Linux server after issuing the TLS certificate for test.workline.ink.
# The Docker web container intentionally listens only on 127.0.0.1:8080.
server {
    listen 80;
    server_name test.workline.ink;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name test.workline.ink;

    ssl_certificate /etc/letsencrypt/live/test.workline.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.workline.ink/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
